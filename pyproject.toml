[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generator and solver library for 42 A-Maze-ing."
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "gjuan-pa" },
    { name = "marcaram" }
]
dependencies = []

[tool.setuptools.packages.find]
include = ["mazegen*"]

[tool.setuptools.package-data]
mazegen = ["README.md"]
